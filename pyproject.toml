# Tooling config only — ramp is not an installable package (the kernel is a
# stdlib-only single file loaded by path; see CLAUDE.md). This file exists to
# hold the ruff lint config that gates CI (.github/workflows/test.yml).

[tool.ruff]
# Match the CI floor: README documents Python 3.8+, so lint against 3.8 too —
# keeps UP (pyupgrade) from proposing 3.9+ syntax that would break the matrix.
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — handled by line-length when it matters
    "B904",  # raise-from — inappropriate in hook/degradation contexts
]

name: test

# The suite is the merge gate (git policy: branch protection on main requires
# CI-green). The 3.8 leg exists to PROVE the documented floor — README says
# Python 3.8+, so a PEP-585 annotation or 3.9+ stdlib call must fail here,
# not on a user's machine. 3.8 runs on ubuntu-22.04: the 24.04 images no
# longer provide it.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - python-version: "3.8"
            runner: ubuntu-22.04
          - python-version: "3.13"
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      # Actions pinned to commit SHAs; Dependabot keeps them current (.github/dependabot.yml).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run the stdlib suite
        run: python3 -m pytest tests/ -q
